app_info:
  name: "DustGrain"
  version: "3.1.0"
  author: "cheily"

cache:
  headers:
    version: 1
    max_age_seconds: 86400
    mode: NOOP

client:
  url: "https://localhost:12345"
  timeout: 10000
  user_agent: ""

cargo_queries:
  - gbvsr:
    - MoveData_GBVSR:
      - input
      - name
      - note : parseWikitext

    - gbvsrCharacters:
      - name
      - health
